name: examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc clang cppcheck
      - name: Tool versions
        run: gcc --version | head -1; clang --version | head -1; cppcheck --version
      - name: Check file hashes
        run: sha256sum -c SHA256SUMS
      - name: Run all examples and compare with expected results
        run: tools/run_all.sh --check
